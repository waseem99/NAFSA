name: NICL Demo CI

on:
  push:
    branches:
      - nicl-wow-demo-plan
    paths:
      - 'package.json'
      - 'vercel.json'
      - 'prototype/**'
      - '.github/workflows/nicl-demo-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'vercel.json'
      - 'prototype/**'
      - '.github/workflows/nicl-demo-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install from repository root
        run: npm install

      - name: Build through repository-root deployment shell
        run: npm run build

      - name: Verify Next.js build output exists
        run: test -f prototype/.next/BUILD_ID

      - name: Install Chromium for Playwright
        working-directory: prototype
        run: npx playwright install --with-deps chromium

      - name: Run NICL presentation smoke tests
        working-directory: prototype
        run: npm run test:demo
