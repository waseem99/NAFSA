name: NICL Demo CI

on:
  push:
    branches:
      - nicl-wow-demo-plan
    paths:
      - 'prototype/**'
      - '.github/workflows/nicl-demo-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/nicl-demo-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js prototype
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run NICL presentation smoke tests
        run: npm run test:demo
